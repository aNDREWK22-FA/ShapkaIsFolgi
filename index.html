<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Neural Scanner v5.0</title>
  <!-- Подключаем TensorFlow.js и модель распознавания лиц BlazeFace -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; color: #0f0; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; border: 2px solid rgba(0, 255, 0, 0.4); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 5; }
    .status-box { background: rgba(0, 20, 0, 0.85); padding: 15px; border: 1px solid #0f0; border-radius: 5px; text-align: center; font-size: 17px; margin-bottom: 30px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    .error-mode { background: rgba(70, 0, 0, 0.9) !important; border-color: #ff2a2a !important; color: #ff2a2a !important; }
  </style>
</head>
<body>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div class="hud">
    <div>[NEURAL-AI v5.0] // НЕЙРОСЕТЬ АКТИВНА<br>СТАТУС: <span id="signal">ЗАГРУЗКА МОДЕЛИ...</span></div>
    <div class="status-box" id="output">Инициализация нейросетевого ядра...</div>
  </div>

  <script>
    const thoughts = [
      "«Где бы сейчас намутить шаурму и не пойти на работу...»",
      "«Надеюсь, никто не заметил, что я сегодня в разных носках.»",
      "«Так, надо сделать умное лицо, будто я понимаю, как это работает.»",
      "«Интересно, а если коту дать валерьянку, он начнет говорить?»",
      "«Блин, утюг дома точно выключил или опять показалось...»",
      "«Сейчас бы на море, а не вот это вот всё...»",
      "«Походу эта штука реально работает, надо срочно думать о чем-то приличном!»"
    ];

    const video = document.getElementById('cam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const out = document.getElementById('output');
    const sig = document.getElementById('signal');

    let model;
    let currentThought = "";
    let facePresent = false;
    let thoughtTimer = null;

    // Скрытый холст для анализа цвета над головой
    const hiddenCanvas = document.createElement('canvas');
    const hiddenCtx = hiddenCanvas.getContext('2d');

    async function init() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      await new Promise(r => video.onloadedmetadata = r);
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      hiddenCanvas.width = video.videoWidth;
      hiddenCanvas.height = video.videoHeight;

      model = await blazeface.load();
      sig.innerText = "ПОИСК ОБЪЕКТА";
      out.innerText = "Наведите камеру на лицо человека...";
      detectLoop();
    }

    function checkFoilHat(topLeft, bottomRight) {
      const faceWidth = bottomRight[0] - topLeft[0];
      const faceHeight = bottomRight[1] - topLeft[1];
      
      // Выбираем зону прямо над лбом (предполагаемое место шапочки)
      const hatX = Math.max(0, topLeft[0] + faceWidth * 0.15);
      const hatY = Math.max(0, topLeft[1] - faceHeight * 0.45);
      const hatW = Math.min(hiddenCanvas.width - hatX, faceWidth * 0.7);
      const hatH = Math.min(hiddenCanvas.height - hatY, faceHeight * 0.35);

      if (hatW <= 10 || hatH <= 10) return false;

      hiddenCtx.drawImage(video, 0, 0);
      const pixels = hiddenCtx.getImageData(hatX, hatY, hatW, hatH).data;
      
      let shinyGrayPixels = 0;
      const totalPixels = pixels.length / 4;
for (let i = 0; i < pixels.length; i += 4) {
        const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
        const brightness = (r + g + b) / 3;
        const maxDiff = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b));
        
        // Фольга дает яркие блики (brightness > 155) и почти не имеет цвета (maxDiff < 25)
        if (brightness > 155 && maxDiff < 25) {
          shinyGrayPixels++;
        }
      }
      // Если больше 35% пикселей над головой похожи на блестящий металл
      return (shinyGrayPixels / totalPixels) > 0.35;
    }

    async function detectLoop() {
      const predictions = await model.estimateFaces(video, false);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (predictions.length > 0) {
        const face = predictions[0];
        const [x1, y1] = face.topLeft;
        const [x2, y2] = face.bottomRight;
        const hasFoil = checkFoilHat(face.topLeft, face.bottomRight);

        // Рисуем рамку вокруг лица (красную при фольге, зеленую в норме)
        ctx.strokeStyle = hasFoil ? "#ff2a2a" : "#00ff00";
        ctx.lineWidth = 4;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

        if (hasFoil) {
          clearTimeout(thoughtTimer);
          thoughtTimer = null;
          out.classList.add('error-mode');
          sig.innerText = "БЛОКИРОВКА СИГНАЛА (0%)";
          out.innerText = "⚠️ ОШИБКА: ОБНАРУЖЕН МЕТАЛЛИЧЕСКИЙ ЭКРАН!\nФольга блокирует считывание мозговых волн.";
        } else {
          out.classList.remove('error-mode');
          if (!facePresent) {
            facePresent = true;
            sig.innerText = "ЗАХВАТ ЦЕЛИ...";
            out.innerText = "Лицо распознано. Дешифровка импульсов...";
            
            thoughtTimer = setTimeout(() => {
              const randomThought = thoughts[Math.floor(Math.random() * thoughts.length)];
              sig.innerText = "СИГНАЛ СТАБИЛЕН (98.2%)";
              out.innerText = "МЫСЛЬ ОБНАРУЖЕНА:\n" + randomThought;
            }, 1500);
          }
        }
      } else {
        // Если лицо пропало из кадра — сбрасываем, чтобы для следующего человека выпала новая мысль
        facePresent = false;
        clearTimeout(thoughtTimer);
        thoughtTimer = null;
        out.classList.remove('error-mode');
        sig.innerText = "ПОИСК ОБЪЕКТА";
        out.innerText = "Наведите камеру на лицо человека...";
      }

      requestAnimationFrame(detectLoop);
    }

    init().catch(e => { out.innerText = "Ошибка доступа к камере или загрузки модели."; });
  </script>
</body>
</html>
