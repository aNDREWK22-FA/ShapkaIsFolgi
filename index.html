<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Scanner v4.5</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; color: #0f0; user-select: none; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; border: 2px solid rgba(0, 255, 0, 0.4); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    .scan-line { position: absolute; width: 100%; height: 3px; background: rgba(0, 255, 0, 0.7); box-shadow: 0 0 10px #0f0; animation: scan 3s infinite linear; }
    @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
    .status-box { background: rgba(0, 20, 0, 0.8); padding: 15px; border: 1px solid #0f0; border-radius: 5px; text-align: center; font-size: 17px; margin-bottom: 40px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    .error-mode { background: rgba(60, 0, 0, 0.85) !important; border-color: #ff2a2a !important; color: #ff2a2a !important; }
    .controls { position: absolute; bottom: 0; width: 100%; height: 90px; display: flex; z-index: 10; }
    .btn-zone { flex: 1; opacity: 0; }
  </style>
</head>
<body>

  <video id="cam" autoplay playsinline></video>
  <div class="scan-line"></div>

  <div class="hud" id="hud">
    <div>[NEURAL-LINK v4.5] // ПОТОК ДАННЫХ<br>СИГНАЛ МОЗГА: <span id="signal">ОЖИДАНИЕ</span></div>
    <div class="status-box" id="output">Наведите камеру на человека для захвата мозговых волн...</div>
  </div>

  <!-- Левый нижний угол = следующая мысль, правый нижний угол = ошибка (фольга) -->
  <div class="controls">
    <div class="btn-zone" onclick="nextThought()"></div>
    <div class="btn-zone" onclick="showError()"></div>
  </div>

  <script>
    // ВПИШИТЕ СЮДА 7 ЗАГОТОВЛЕННЫХ ФРАЗ (ПО ОДНОЙ В КАВЫЧКАХ):
    const thoughts = [
      "«Где бы сейчас намутить шаурму и не пойти на работу...»",
      "«Надеюсь, никто не заметил, что я сегодня в разных носках.»",
      "«Так, надо сделать умное лицо, будто я понимаю, как это работает.»",
      "«Интересно, а если коту дать валерьянку, он начнет говорить?»",
      "«Блин, утюг дома точно выключил или опять показалось...»",
      "«Сейчас бы на море, а не вот это вот всё...»",
      "«Походу эта штука реально работает, надо срочно думать о чем-то приличном!»"
    ];

    let currentIndex = 0;
    let isScanning = false;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => { document.getElementById('cam').srcObject = stream; })
      .catch(err => { document.getElementById('output').innerText = "Ошибка: разрешите доступ к камере в браузере"; });

    function nextThought() {
      if (isScanning) return;
      isScanning = true;

      const out = document.getElementById('output');
      const sig = document.getElementById('signal');

      out.classList.remove('error-mode');
      sig.innerText = "СКАНИРОВАНИЕ...";
      out.innerText = "Дешифровка нейронного импульса... [47%]";

      // Пауза 1.5 секунды для эффекта настоящей обработки
      setTimeout(() => {
        sig.innerText = "СТАБИЛЬНЫЙ (97.8%)";
        out.innerText = "МЫСЛЬ ОБНАРУЖЕНА:\n" + thoughts[currentIndex];

        // Переключаем на следующую фразу для следующего человека
        currentIndex = (currentIndex + 1) % thoughts.length;
        isScanning = false;
      }, 1500);
    }

    function showError() {
      isScanning = false;
      const out = document.getElementById('output');
      const sig = document.getElementById('signal');

      out.classList.add('error-mode');
      sig.innerText = "БЛОКИРОВКА (0.0%)";
      out.innerText = "⚠️ ОШИБКА: СИГНАЛ ЭКРАНИРОВАН!\nОбнаружен металлический барьер (фольга). Считывание невозможно.";
    }
  </script>
</body>
</html>
